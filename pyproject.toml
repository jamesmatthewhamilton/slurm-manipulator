[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-manipulator"
version = "0.3.0"
description = "Primitive tools for Slurm job manipulation over SSH (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
# Stdlib only. No yaml — config parsing belongs in the consumer.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
slurm_manipulator = ["sbatch/*.sbatch", "scripts/*.sh"]
